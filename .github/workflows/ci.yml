name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Zitbaba.sln

      - name: Build
        run: dotnet build Zitbaba.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Zitbaba.sln --configuration Release --no-build --verbosity normal
